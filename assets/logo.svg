<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-camp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2D0607"/>
      <stop offset="70%" stop-color="#140203"/>
      <stop offset="100%" stop-color="#050101"/>
    </radialGradient>
    <linearGradient id="blade-crimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="50%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="gold-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="camp-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="url(#bg-camp-glow)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#371B1D" stroke-width="2" stroke-dasharray="8,6"/>

  <!-- Tactical Cross & Chevron Core -->
  <g transform="translate(256, 240)">
    <!-- Outer Shield / Hexagonal Aura -->
    <polygon points="0,-160 135,-80 135,80 0,160 -135,80 -135,-80" fill="none" stroke="#7F1D1D" stroke-width="2" opacity="0.4"/>
    <polygon points="0,-145 120,-70 120,70 0,145 -120,70 -120,-70" fill="none" stroke="url(#blade-crimson)" stroke-width="2.5" stroke-dasharray="70 40" filter="url(#camp-glow)"/>

    <!-- 4 Minister Cardinal Nodes -->
    <!-- North: Adhipati (Crown) -->
    <circle cx="0" cy="-145" r="10" fill="url(#gold-accent)" filter="url(#camp-glow)"/>
    <!-- East: Bhakta (Execution Hammer) -->
    <circle cx="120" cy="0" r="8" fill="url(#blade-crimson)"/>
    <!-- South: Antaryami (Eye / Reflection) -->
    <circle cx="0" cy="145" r="8" fill="#818CF8"/>
    <!-- West: Jigyasu (Book / Learning) -->
    <circle cx="-120" cy="0" r="8" fill="#34D399"/>

    <!-- Central Levitating Tactical Blades -->
    <!-- Blade Left -->
    <polygon points="-55,-80 -10,-10 -25,95 -70,25" fill="url(#blade-crimson)"/>
    <!-- Blade Right -->
    <polygon points="55,-80 10,-10 25,95 70,25" fill="url(#blade-crimson)"/>
    <!-- Central Spearhead -->
    <polygon points="0,-115 28,15 0,80 -28,15" fill="url(#gold-accent)" filter="url(#camp-glow)"/>
    <!-- Core Diamond Pivot -->
    <polygon points="0,-25 18,0 0,25 -18,0" fill="#FFFFFF"/>

    <!-- Sub-Millisecond Speed Streaks -->
    <line x1="-90" y1="-40" x2="-35" y2="-15" stroke="#FCA5A5" stroke-width="2" opacity="0.6"/>
    <line x1="90" y1="-40" x2="35" y2="-15" stroke="#FCA5A5" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- Base Typography -->
  <text x="256" y="445" text-anchor="middle" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" letter-spacing="4">ANTIGRAVITY</text>
  <text x="256" y="470" text-anchor="middle" fill="#EF4444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="3">CAMPAIGNS</text>
</svg>
